abstract:
- language: en
  script: Latn
  content: "<p>This document describes the transport of IP datagrams over the \nSecurity
    Industry Association standard [3] five-conductor cable \ncalled the Wiegand interface
    used for communication between card \nreaders and control panels in physical access
    control systems.  \n\n \n \n Conventions used in this document \n\nIn examples,
    &quot;C:&quot; and &quot;S:&quot; indicate lines sent by the client and \nserver
    respectively. \n\nThe key words &quot;MUST&quot;, &quot;MUST NOT&quot;, &quot;REQUIRED&quot;,
    &quot;SHALL&quot;, &quot;SHALL NOT&quot;, \n&quot;SHOULD&quot;, &quot;SHOULD NOT&quot;,
    &quot;RECOMMENDED&quot;, &quot;MAY&quot;, and &quot;OPTIONAL&quot; in this \ndocument
    are to be interpreted as described in RFC-2119 [1].</p>"
