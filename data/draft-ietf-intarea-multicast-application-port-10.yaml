abstract:
- language: en
  script: Latn
  content: |-
    <p>This document discusses the drawbacks of the current practice of
       assigning a UDP port to each multicast application.  Such assignments
       are redundant because the multicast group address already identifies
       the traffic.  This document assigns a UDP port for use by multicast
       applications and lists requirements for using it.  The approach works
       with existing protocol stacks today, and the document also defines
       host enhancements that help safeguard the ongoing cooperative use of
       this port by multicast applications.</p>
