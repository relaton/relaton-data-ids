abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes the &#39;hrn:&#39; Uniform Resource Identifier (URI)
    scheme for hierarchical resource names.
    The &#39;hrn:&#39; URI scheme belongs to the class of Hierarchical URI
    Schemes as defined in RFC 2396 &#39;Uniform Resource Identifiers (URI):
    Generic Syntax&#39;.
    This URI scheme is also a type of URN, as defined by RFC 2396, but is
    not a namespace of the &#39;urn:&#39; URI scheme.</p>
