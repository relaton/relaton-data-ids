abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies the 'creduent' Uniform Resource Identifier
       (URI) scheme and its associated cryptographic attestation protocol.
       The 'creduent' scheme defines a transport-agnostic, cryptographically
       verifiable addressing layer for identifying autonomous software
       agents, binding domain ownership via DNSSEC TXT records, resolving
       agent identity documents via deterministic HTTPS well-known paths,
       and validating attenuated capability delegation tokens with Proof-of-
       Possession.</p>
