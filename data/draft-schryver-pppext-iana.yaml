abstract:
- language: en
  script: Latn
  content: "<p>The charter of the Point-to-Point Protocol (PPP) Extensions working
    group (pppext) includes the responsibility to &quot;actively advance PPP&#39;s
    most useful extensions to full standard, while defending against further enhancements
    of questionable value.&quot; In support of that charter, the allocation of PPP
    protocol and other assigned numbers will no longer be &quot;first come first served.&quot;
    This document specifies an Internet Best Current Practices for the Internet Community,
    and requests discussion and suggestions for improvements.</p>"
