abstract:
- language: en
  script: Latn
  content: "<p>The &#39;Internet X.500 Schema&#39; defines an RFC-822 email address
    attribute of a person&#39;s entry, rfc822Mailbox (aka &#39;Mail&#39;), but it
    does not address the issues involved in routing RFC-822-based email within an
    administrative domain served by an X.500/LDAP-based directory service. Significantly,
    it doesn&#39;t delineate between a person&#39;s publicaly &#39;advertised&#39;
    or &#39;promoted&#39; email address and the actual &#39;internal to the administrative
    domain&#39; address for the person.                                                    This
    memo illustrates an object class and an attendant attribute we use at Stanford
    University to solve this issue. This scheme provides us with flexible, simple
    to implement, distributed routing of RFC-822-based email to people represented
    by entries within our directory service. The LDAP-enabled version of sendmail
    we use is freely available.               Additionally, we anticipate that the
    Internet community will devise conventions and perhaps support a process for facilitating
    multi-vendor directory utilization. We present an anticipated tenet and goals.</p>"
