abstract:
- language: en
  script: Latn
  content: |-
    <p>This memo describes a method used to ask for and receive
    notifications.  These notifications will be the direct result of a
    stored components and the notifications or changes to components or
    the store and are represented in iCalendar format. This is an
    extensions to iCalendar objects.
    This memo has been updated to include non-CAP notificaitons.
    This memo includes a new CAP command types of &#39;REQUEST-NOTIFY&#39;,
    &#39;NOTIFICATION&#39;, and &#39;CANCEL-NOTIFY&#39;, a new property of &#39;OBSERVER&#39;, a
    new iCalendar component &#39;NOTIFICATION&#39;, CAP capabilities of
    &#39;CAN-NOTIFY&#39;, &#39;NOTIFY-UPDATES&#39;, and &#39;ALLOW-NOTIFY-BOT&#39;. A
    &#39;REQUEST-NOTIFY&#39; command is a request to add an observer to an
    component in the &#39;TARGET&#39; calendar. In addition the &#39;REQUEST-NOTIFY&#39;
    command can alert the CUA of changes to specific components or in the
    calendar or calendar store. Everything is subject to VCAR
    restrictions.
    These are asynchronous notifications must be advertised by the CS and
    requested by the CUA. This memo discusses how to transport these
    iCalendar objects and using them with CAP.
    In addition if the CS and CUA support the &#39;NOTIFY-UPDATES&#39;
    capability, then the CS will send &#39;NOTIFICATION&#39; components to the
    CUA describing the UIDs or TARGETS that have changed since the
    currently authenticated CU was last connected allowing for easier
    synchronization.</p>
