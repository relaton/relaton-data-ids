abstract:
- language: en
  script: Latn
  content: |-
    <p>This profile lets a verifier decide whether an Agent may perform the
       requested operation on the current connection.  The verifier binds
       the grant to that connection and checks the request against the grant
       and local policy.  On success, the application receives an assertion
       scoped to the interaction.</p>
