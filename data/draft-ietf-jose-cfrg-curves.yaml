abstract:
- language: en
  script: Latn
  content: "<p>This document defines how to use the Diffie-Hellman algorithms &quot;X25519&quot;
    and &quot;X448&quot; as well as the signature algorithms &quot;Ed25519&quot; and
    &quot;Ed448&quot; from the IRTF CFRG elliptic curves work in JSON Object Signing
    and Encryption (JOSE).</p>"
