abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines an extension for MoQ Transport [moqt] that
       attaches a media presentation timestamp and duration to each object.
       A track-level Timescale property establishes the units, an object-
       level Timestamp property carries the presentation time of each
       object, and an optional Duration property carries its presentation
       duration.  Exposing media time to the transport lets relays make
       consistent age-based decisions (e.g. dropping stale objects) without
       parsing the media container, and it remains consistent across hops
       regardless of buffering or jitter.</p>
