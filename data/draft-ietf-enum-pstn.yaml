abstract:
- language: en
  script: Latn
  content: "<p>This document registers the Enumservice type &quot;pstn&quot; and subtype
    &quot;tel&quot; using the URI scheme &#39;tel&#39;, as well as the subtype &quot;sip&quot;
    using the URI scheme &#39;sip&#39; as per the IANA registration process defined
    in the ENUM specification, RFC 3761.  This Enumservice is used to facilitate the
    routing of telephone calls in those countries where number portability exists.
    [STANDARDS-TRACK]</p>"
