abstract:
- language: en
  script: Latn
  content: |-
    <p>Autonomous and semi-autonomous AI agents are published through
       multiple discovery mechanisms, including AI Catalog, DNS-based
       discovery, enterprise gateways, Agentic Resource Discovery (ARD)
       services, platform registries, A2A Agent Cards, MCP server
       descriptors, telecom directories, sovereign registries, and
       vertical-specific systems. This diversity is useful, but it creates
       discovery islands when a requester knows an identity but does not
       know which discovery mechanism is authoritative for that identity.


       This document defines a Federated Resolution Architecture that
       separates identity resolution from capability discovery. Resolution
       maps a stable subject identity to one or more discovery entry points.
       Discovery then retrieves resources through the selected mechanism.
       The architecture uses a conforming AI Catalog document as the
       response envelope and defines an agent-resolution-target JSON object
       for typed pointers to catalogs, DNS-AID organization indexes, ARD
       services, gateways, registries, hosted descriptors, and other
       resolution services.


       NandaIndex is described as a federated implementation of this
       architecture: a global switchboard of lightweight, authority-bound
       pointers. Direct enterprise discovery remains direct when an
       authoritative endpoint is already known. NandaIndex is used when the
       discovery mechanism is unknown, when multiple mechanisms coexist, or
       when small businesses, individuals, and emerging directories require
       a stable identity-to-discovery mapping without operating a unified
       enterprise stack.</p>
