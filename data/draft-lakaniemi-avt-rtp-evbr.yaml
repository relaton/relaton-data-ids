abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the Real-Time Transport Protocol (RTP) \npayload
    format for the Embedded Variable Bit-Rate (EV-VBR) \nspeech/audio codec, specified
    in ITU-T G.718. A media type \nregistration for this RTP payload format is also
    included. \n\n\n \n \n Conventions used in this document \n\nThe key words &quot;MUST&quot;,
    &quot;MUST NOT&quot;, &quot;REQUIRED&quot;, &quot;SHALL&quot;, &quot;SHALL NOT&quot;,
    \n&quot;SHOULD&quot;, &quot;SHOULD NOT&quot;, &quot;RECOMMENDED&quot;, &quot;MAY&quot;,
    and &quot;OPTIONAL&quot; in this \ndocument are to be interpreted as described
    in RFC 2119 [RFC2119].</p>"
