abstract:
- language: en
  script: Latn
  content: |-
    <p>A BGP Flow Specification is an n-tuple consisting of several
       matching criteria that can be applied to IP traffic. This document
       defines how to perform Flow Specification traffic diversion based on
       the characteristics of QUIC packets.</p>
