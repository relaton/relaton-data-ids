abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies use of the SIGZERO and SIG(0) Domain Name
       System (DNS) Resource Records (RRs) to provide public key based
       authentication of DNS requests and transactions.  This document
       obsoletes RFC 2931.</p>
