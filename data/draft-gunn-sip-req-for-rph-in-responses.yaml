- content: draft-gunn-sip-req-for-rph-in-responses
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: "<p>The Session Initiation Protocol (SIP) Resource Priority Header\n(RPH),
    in its current form, is ignored in SIP responses.  This was \na design choice
    during RFC 4412&#39;s development. This is now \nconsidered a bad design choice
    in certain scenarios. The Internet \nDraft &quot;Allowing SIP Resource Priority
    Header in SIP Responses&quot; \n(draft-polk-sip-rph-in-responses-00) describes
    a modification to \nRFC4412 to permit RPH in responses. This document describes
    one of \nthe requirements associated with systems using RPH, that could be \nsatisfied
    by the modification of RFC 4412 to permit RPH on \nresponses, and is not easily
    met by other methods. This ID provides\n additional motivation for SIP RPH in
    Responses.\n\nThe key words &quot;MUST&quot;, &quot;MUST NOT&quot;, &quot;REQUIRED&quot;,
    &quot;SHALL&quot;, &quot;SHALL NOT&quot;,\n&quot;SHOULD&quot;, &quot;SHOULD NOT&quot;,
    &quot;RECOMMENDED&quot;, &quot;MAY&quot;, and &quot;OPTIONAL&quot; in this\ndocument
    are to be interpreted as described in [RFC2119].</p>"
