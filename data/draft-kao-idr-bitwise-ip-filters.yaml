abstract:
- language: en
  script: Latn
  content: |-
    <p>This draft introduces the bitwise matching filters for source or
       destination IPv4/IPv6 address fields.  These filters enhance the
       functionalities of the BGP Flow Specification framework and aid
       scenarios involving symmetric traffic load balancing.</p>
