abstract:
- language: en
  script: Latn
  content: |-
    <p>This specification describes a way to carry the Extensible 
    Authentication Protocol (EAP) over the Internet Control Message 
    Protocol (ICMP). This provides a generic mechanism for user/device 
    authentication to access routers or other designated nodes.</p>
