- language: en
  script: Latn
  content: "<p>This document defines a MIME directory profile [1] for holding a\n
    \  WHOIS [2] schema and is intended for communication with the Internet\n   schema
    listing service.\n \n   The key words &#39;MUST&#39;, &#39;MUST NOT&#39;, &#39;REQUIRED&#39;,
    &#39;SHALL&#39;, &#39;SHALL NOT&#39;,\n   &#39;SHOULD&#39;, &#39;SHOULD NOT&#39;,
    &#39;RECOMMENDED&#39;,  &#39;MAY&#39;, and &#39;OPTIONAL&#39; in this\n   document
    are to be interpreted as described in RFC 2119 [3].</p>"
