abstract:
- language: en
  script: Latn
  content: |-
    <p>The Ethernet Virtual Private Network (EVPN) solution offers
       procedures for electing a Designated Forwarder (DF) for multihomed
       Ethernet Segments.  In this context, the Provider Edge (PE) router is
       responsible for sending Broadcast, Unknown Unicast, and Multicast
       (BUM) traffic to a multihomed device or network.  This applies in
       cases of an all-active multihomed Ethernet Segment (ES) as well as
       for BUM and unicast traffic in the case of single-active multi-
       homing.  While the Default Algorithm provides an efficient and
       automated way of selecting the DF across different Ethernet Tags in
       the Ethernet Segment, but lacks in providing per flow based DF within
       the given EVPN Instances (EVIs).</p>
