abstract:
- language: en
  script: Latn
  content: |-
    <p>The Capability Language Core defines what an authorization decision
       evaluates and how the result is derived.  It does not define how the
       evidence behind a decision is carried or checked.  This document
       fixes one projection from a native evidence format — an authorization
       requirement and the results a native verifier established — into the
       CLC evidence view, and a binding profile for the EMILIA evidence
       chain.  It adds no authorization model, no new verdict and no new
       conformance class: where the native format says something the
       evidence view cannot express, the projection says so and leaves the
       obligation where it belongs.</p>
