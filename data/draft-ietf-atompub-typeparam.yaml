abstract:
- language: en
  script: Latn
  content: |-
    <p>The Atom Syndication Format (RFC 4287) defines the &#39;application/
       atom+xml&#39; media type to identify both Atom Feed and Atom Entry
       Documents.  This document defines an optional &#39;type&#39; parameter used
       to differentiate the two types of Atom documents.</p>
