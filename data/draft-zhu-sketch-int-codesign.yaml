abstract:
- language: en
  script: Latn
  content: |-
    <p>Network measurement is a fundamental building block for network
       management applications.  Existing measurement techniques face a
       trade-off between accuracy and resource efficiency: sketch-based
       techniques achieve high accuracy for large flows but degrade for
       small flows, while In-band Network Telemetry (INT) measures every
       flow accurately but at the cost of significant bandwidth and control
       plane resources.

       This document describes a framework for co-designing sketches and INT
       to measure large and small flows respectively, achieving both high
       accuracy and resource efficiency.  It addresses two key challenges:
       (1) where to deploy measurement functions when routing information is
       incomplete, and (2) how to collect measurement data without causing
       network congestion.</p>
