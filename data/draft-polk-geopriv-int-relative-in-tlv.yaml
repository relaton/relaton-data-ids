abstract:
- language: en
  script: Latn
  content: "<p>This document IANA registers XML elements of interior locations \n&lt;INT&gt;
    in a common TLV format.\nThe key words &quot;MUST&quot;, &quot;MUST NOT&quot;,
    &quot;REQUIRED&quot;, &quot;SHALL&quot;, &quot;SHALL NOT&quot;,\n&quot;SHOULD&quot;,
    &quot;SHOULD NOT&quot;, &quot;RECOMMENDED&quot;, &quot;MAY&quot;, and &quot;OPTIONAL&quot;
    in this\ndocument are to be interpreted as described in RFC 2119 [RFC 2119].</p>"
