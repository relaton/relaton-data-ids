abstract:
- language: en
  script: Latn
  content: "<p>The Routing Over Low power and Lossy network (ROLL) Working Group has
    \nbeen chartered to work on routing solutions for Low Power and Lossy \nnetworks
    (LLN) in various markets: Industrial, Commercial (Building), \n \n \n Home and
    Urban. Pursuant to this effort, this document defines the \nrouting requirements
    for building automation.\n\n\n \n\nRequirements Language \n\nThe key words &quot;MUST&quot;,
    &quot;MUST NOT&quot;, &quot;REQUIRED&quot;, &quot;SHALL&quot;, &quot;SHALL NOT&quot;,
    \n&quot;SHOULD&quot;, &quot;SHOULD NOT&quot;, &quot;RECOMMENDED&quot;, &quot;MAY&quot;,
    and &quot;OPTIONAL&quot; in this \ndocument are to be interpreted as described
    in RFC-2119.</p>"
