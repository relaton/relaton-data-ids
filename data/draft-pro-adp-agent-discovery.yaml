abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies the Agent Discovery Protocol (ADP), a three-
       layer discovery mechanism for AI Agents that leverages existing
       Internet infrastructure: DNS TXT and SRV records for lightweight
       service discovery (Layer 1), Well-Known URIs for machine-readable
       metadata (Layer 2), and HTML landing pages with WebSocket channels
       for human interaction and inter-agent communication (Layer 3).  ADP
       enables any domain owner to make their AI Agent discoverable without
       relying on centralized registries, using the Domain Name System as
       the decentralized trust anchor.</p>
