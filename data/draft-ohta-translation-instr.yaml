abstract:
- language: en
  script: Latn
  content: "<p>A framework is given to coordinate the worldwide effort of RFC translation
    into various languages.                                                    Translated
    RFCs will be encoded in 7bit ISO 2022 and will have a name &#39;TRFC NNNN-LLL-MM&#39;
    where &#39;NNNN&#39; is the RFC number of the original RFC, &#39;LLL&#39; is the
    language tag and &#39;MM&#39; is the sequence number to identify different translations.
    \                                                   Formatting rules similar to
    ASCII RFCs are also described.</p>"
