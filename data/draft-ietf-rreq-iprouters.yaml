abstract:
- language: en
  script: Latn
  content: "<p>The memo is Volume 1 of a draft replacement for RFC-1009, &#39;Requirements
    for Internet Gateways&#39;.  Together, the four volumes of this specification
    define and discuss the requirements for devices which perform the network layer
    forwarding function of the Internet protocol suite.  The Internet community usually
    refers to such devices as &#39;routers&#39;.  These voumes are intended to provide
    guidance for vendors, implementors, and sophisticated purchasers of IP routers.</p>"
