abstract:
- language: en
  script: Latn
  content: |-
    <p>Ever since 1969 and the ARPANET, the internet has repeatedly been
       faced with challenges that it has had to overcome.  With the advent
       of autonomous AI agents, a new communication paradigm is required.
       The Internet Agent Communication Protocol (IACP) defines a complete
       architecture for secure, identity-centric agent-to-agent
       communication, including identity-locator separation, a Deterministic
       Hypermedia Interpreter (DHI), the EID Routing Protocol (ERP),
       Persistent State Sessions (PSS), and decentralized governance
       mechanisms.</p>
