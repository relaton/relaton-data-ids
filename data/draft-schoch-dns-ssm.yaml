abstract:
- language: en
  script: Latn
  content: "<p>One of the obstacles in implementing any version of Multicast is \ncreating
    a method of advertising what is being &#39;broadcast&#39; on any \nparticular
    &#39;channel&#39;.  This document defines a method for using the \nexisting Domain
    Name Service (DNS)[RFC1034, RFC1035] infrastructure \nto assist in advertising
    Source-Specific Multicast [SSM] &#39;channels&#39; \n(S,G pairs).</p>"
