  content: Parent's SIG over child's KEY
docidentifier:
- content: draft-ietf-dnsop-parent-sig
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: "<p>When dealing with large amounts of keys the procedures to update a
    zone and to sign a zone need to be clearly defined and practically possible. \nThe
    current idea is to have the KEY RR and the parent&#39;s SIG to reside in the child&#39;s
    zone and perhaps also in the parent&#39;s zone. We feel that this would lead to
    very complicated procedures for large TLD&#39;s. We propose a alternative scheme
    in which the parent zone stores the parent&#39;s signature over the child&#39;s
    key and also a copy of the child&#39;s key itself. \nThe advantage of this proposal
    is that all signatures signed by a key are in the same zone file as the producing
    key. This allows for a simple key rollover and resigning mechanism. For large
    TLD&#39;s this is extremely important.\nWe further discuss the impact on a secure
    aware resolver/forwarder.</p>"
