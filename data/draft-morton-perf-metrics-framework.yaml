abstract:
- language: en
  script: Latn
  content: |-
    <p>This memo describes a framework and guidelines for the development of
    performance metrics that are beyond the scope of existing working
    group charters in the IETF.  In this version, the memo refers to a
    Performance Metrics Entity, or PM Entity, which may in future be a
    working group or directorate or a combination of these two.Requirements Language

    The key words &quot;MUST&quot;, &quot;MUST NOT&quot;, &quot;REQUIRED&quot;, &quot;SHALL&quot;, &quot;SHALL NOT&quot;,
    &quot;SHOULD&quot;, &quot;SHOULD NOT&quot;, &quot;RECOMMENDED&quot;, &quot;MAY&quot;, and &quot;OPTIONAL&quot; in this
    document are to be interpreted as described in RFC 2119 [RFC2119].</p>
