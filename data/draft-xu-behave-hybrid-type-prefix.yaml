abstract:
- language: en
  script: Latn
  content: "<p>To build IPv4-Embedded IPv6 addresses for IPv4/IPv6 translation, the
    \nWell-Known Prefix (WKP) and Network Specific Prefix (NSP)-based \naddress formats
    have been defined in [Address-Format]. However, both \nof them have some limitations
    in several use cases. Hence, this \ndocument aims at discussing the validity of
    the use cases and assess \nthe interest of the BEHAVE WG to meet the requirement
    of \nunambiguously distinguishing IPv4-Embedded IPv6 addresses from \nnative IPv6
    ones. Doing so would guide the address selection and \ntherefore allow avoiding
    crossing unnecessary or even useless \naddress family translators.  \n\nConventions
    used in this document \n\nThe key words &quot;MUST&quot;, &quot;MUST NOT&quot;,
    &quot;REQUIRED&quot;, &quot;SHALL&quot;, &quot;SHALL NOT&quot;, \n&quot;SHOULD&quot;,
    &quot;SHOULD NOT&quot;, &quot;RECOMMENDED&quot;, &quot;MAY&quot;, and &quot;OPTIONAL&quot;
    in this \ndocument are to be interpreted as described in RFC-2119 [RFC2119].</p>"
