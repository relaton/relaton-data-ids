abstract:
- language: en
  script: Latn
  content: "<p>This document provides a working definition of &#39;absolute scalability&#39;
    and &#39;weak scalability&#39; of a method of an ad hoc network, and also a way
    of comparing the scalability of two different methods.  A method may be a protocol,
    an algorithm, or a scheme whose scalability needs to be evaluated.  For example,
    it may be a routing protocol or a MAC protocol.  &#39;Absolute scalability&#39;
    emphasizes the asymptotic behavior of a set of metrics, which define the efficiency
    of the network as a network parameter tends to infinity.  &#39;Weak scalability&#39;
    refers \nto the comparison of the metrics over a given range.  Finally, fairness
    in the comparison of these metrics is discussed.</p>"
