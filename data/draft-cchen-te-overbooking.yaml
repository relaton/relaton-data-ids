  content: |-
    <p>This contribution aims at examining the notion of overbooking 
    in detail and its application on traffic engineering and 
    capacity planning. For the ease of explanation, MPLS network 
    with DiffServ support is used to demonstrate the concept in 
    the subsequent sections.</p>
