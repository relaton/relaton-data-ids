abstract:
- language: en
  script: Latn
  content: |-
    <p>This memo describes the Intel PXE (Preboot Execution Environment) 
    remote boot definition (which is part of Intel's Wired for Management 
    initiative), and provides the rationale for proposing an extended 
    remote boot capability beyond what is currently specified in DHCP.</p>
