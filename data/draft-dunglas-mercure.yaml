abstract:
- language: en
  script: Latn
  content: |-
    <p>Mercure is a protocol enabling the pushing of data updates to web
       browsers and other HTTP clients in a fast, reliable and battery-
       efficient way.  It is especially useful for publishing real-time
       updates of resources served through web APIs to web and mobile apps.</p>
