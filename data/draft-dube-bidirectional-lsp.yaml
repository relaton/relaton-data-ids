abstract:
- language: en
  script: Latn
  content: |-
    <p>This memo proposes extensions to support bi-directional LSPs for
    classical MPLS. Specifically RSVP-TE is extended with objects 
    similar to those in GMPLS to allow establishment of bi-directional 
    LSPs for MPLS networks.</p>
