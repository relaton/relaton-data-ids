abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a core verifier-side acceptance profile for
       session-bound Agent identity.  A verifier accepts an Agent only when
       a verified authority grant, holder-of-key proof, accepted TLS or
       exported-authenticator session, freshness and replay state, any
       required attestation result, and verifier-local policy all describe
       the same intended interaction.

       This document does not define a TLS extension, attestation evidence
       format, identity provider, holder-side presentation format, registry,
       control plane, gateway, or application protocol.  Instead, it defines
       the fail-closed acceptance rule for composing existing Internet
       mechanisms at the verifier boundary.</p>
