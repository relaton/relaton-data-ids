abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines new Attribute Value Pairs (AVPs) that add 
       cryptographic algorithm agility and other security features 
       (protected results and cryptographic binding of inner authentications 
       to the outer tunnel) to EAP-TTLSv0.</p>
