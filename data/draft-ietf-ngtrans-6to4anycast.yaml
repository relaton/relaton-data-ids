abstract:
- language: en
  script: Latn
  content: "<p>This memo introduces a &quot;6to4 anycast address&quot; in order to
    simplify the configuration of 6to4 routers.  It also defines how this address
    will be used by 6to4 relay routers, how the corresponding &quot;6to4 anycast prefix&quot;
    will be advertised in the IGP and in the EGP.  The memo documents the reservation
    by IANA (Internet Assigned Numbers Authority) of the &quot;6to4 relay anycast
    prefix.&quot; [STANDARDS-TRACK]</p>"
