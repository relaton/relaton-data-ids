abstract:
- language: en
  script: Latn
  content: "<p>PDF, the &#39;Portable Document Format&#39;, is a general document
    representation language that has been in use for document exchange on the Internet
    since 1993.  This document provides an overview of the PDF format, explains the
    mechanisms for digital signatures and encryption within PDF files, and updates
    the media type registration of &#39;application/pdf&#39;.  This memo provides
    information for the Internet community.</p>"
