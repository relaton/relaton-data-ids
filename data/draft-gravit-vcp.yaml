abstract:
- language: en
  script: Latn
  content: |-
    <p>Verifiable Convergence Protocol (VCP) defines minimal data types and
       APIs for autonomous agents to achieve epistemic convergence without
       centralized truth arbiters.  VCP is transport-agnostic, blockchain-
       agnostic, and model-agnostic.  The key invariant: C(manipulation) &gt;
       C(validation) for all Claim objects.</p>
