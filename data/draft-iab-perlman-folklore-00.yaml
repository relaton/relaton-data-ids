abstract:
- language: en
  script: Latn
  content: "<p>This document is intended to set the tone as an IETF collaboration
    to\n   collect various tricks and &#39;&#39;gotchas&#39;&#39; in protocol design.
    It is not\n   intended to declare the &#39;&#39;right&#39;&#39; and &#39;&#39;wrong&#39;&#39;
    ways of doing things, but\n   rather &#39;&#39;this practice has the following
    advantages and\n   disadvantages&#39;&#39;, or &#39;&#39;here are several ways
    of solving the following\n   problem&#39;&#39;, with technical explanation of
    the pros and cons of the\n   various approaches.\n \n   Discussion will take place
    on the mailing list\n   folklore@external.cisco.com. To join, send a message to
    folklore-\n   request@external.cisco.com.</p>"
