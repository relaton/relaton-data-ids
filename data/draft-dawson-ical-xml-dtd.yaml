abstract:
- language: en
  script: Latn
  content: "<p>This memo defines a [XML] Document Type Definition (DTD) that\n   corresponds
    to the iCalendar, calendaring and scheduling core object\n   format defined by
    [RFC2445]. This DTD provides equivalent\n   functionality to the standard format
    defined by [RFC2445]. Documents\n   structured in accordance with this DTD may
    also be know as &#39;XML\n   iCalendar&#39; documents.\n \n   The mailing list
    for discussion of this memo is &#39;ietf-\n   calendar@imc.org&#39;. Send an email
    to &#39; ietf-calendar-request@imc.org&#39;\n   with the message &#39;SUBSCRIBE&#39;
    to add your email address to this\n   mailing list. Send an email to &#39; ietf-vcard-xml-request@imc.org&#39;
    with\n   the message &#39;UNSUBSCRIBE&#39; to remove your email address from this\n
    \  mailing list.\n \n   The key words &#39;MUST&#39;, &#39;MUST NOT&#39;, &#39;REQUIRED&#39;,
    &#39;SHALL&#39;, &#39;SHALL NOT&#39;,\n   &#39;SHOULD&#39;, &#39;SHOULD NOT&#39;,
    &#39;RECOMMENDED&#39;, &#39;MAY&#39; and &#39;OPTIONAL&#39; in this\n   document
    are to be interpreted as described in [RFC 2119].</p>"
