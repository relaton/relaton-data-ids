abstract:
- language: en
  script: Latn
  content: "<p>The Presence Information Data Format - Location Object (PIDF-LO) \nlacks
    an indication for the timezone offset of a particular \npresentity is in.  This
    document extends the PIDF-LO for including \nsuch an XML element.\nThe key words
    &quot;MUST&quot;, &quot;MUST NOT&quot;, &quot;REQUIRED&quot;, &quot;SHALL&quot;,
    &quot;SHALL NOT&quot;,\n&quot;SHOULD&quot;, &quot;SHOULD NOT&quot;, &quot;RECOMMENDED&quot;,
    &quot;MAY&quot;, and &quot;OPTIONAL&quot; in this\ndocument are to be interpreted
    as described in RFC 2119 [RFC2119].</p>"
