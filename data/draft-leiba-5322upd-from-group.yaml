formattedref:
  content: draft-leiba-5322upd-from-group
title:
- language: en
  script: Latn
  content: Update to Internet Message Format to Allow Group Syntax in the "From:"
    and "Sender:" Header Fields
docidentifier:
- content: draft-leiba-5322upd-from-group
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: "<p>The Internet Message Format (RFC 5322) allows &quot;group&quot; syntax
    in some email header fields, such as &quot;To:&quot; and &quot;CC:&quot;, but
    not in &quot;From:&quot; or &quot;Sender:&quot;.  This document updates RFC 5322
    to relax that restriction, allowing group syntax in those latter fields, as well
    as in &quot;Resent-From:&quot; and &quot;Resent-Sender:&quot;, in certain situations.</p>"
