abstract:
- language: en
  script: Latn
  content: "<p>This document updates RFC 7315, by modifying the extension-access-
    info part of the P-Access-Network-Info header field Augmented Backus- Naur Form
    (ABNF), and by adding the following &#39;access-info&#39; header field parameter
    values to the list of &#39;access-info&#39; header field parameter values in the
    ABNF: &#39;operator-specific-GI&#39; and &#39;utran-sai-3gpp&#39;.  The values
    are defined in the ABNF but are not included in the list.</p>"
