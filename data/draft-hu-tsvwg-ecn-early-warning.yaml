abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines an early-warning ECN mechanism for WAN.  With
       the growing demand for AI computing power, the computational capacity
       of a single Artificial Intelligence Data Center (AIDC) can no longer
       meet the requirements of large-scale model training.  This has led to
       the emergence of cross-AIDC distributed model training, driving the
       need for transmitting RoCEv2 packets across WANs.  AI training is
       highly sensitive to network packet loss, where even minimal packet
       loss can significantly degrade training efficiency.  Additionally,
       elephant flows and extreme concurrent traffic impose higher demands
       on network performance.

       ECN achieves active feedback of network congestion by setting ECN
       flag bits in the header of IP packets, which is an effective traffic
       control method.  RFC 6040 specifies how ECN is propagated across IP-
       in-IP tunnels.  However, due to the much higher end-to-end delay in
       WAN than in DC, and the frequent occurrence of instantaneous traffic
       bursts in WAN, it is easy to trigger ECN at the wrong time.  This
       document addresses these limitations with a two-threshold ECN
       mechanism for a single managed WAN domain: a lower threshold marks
       packets ECT(1) as a domain-local early-warning signal, a higher
       threshold marks packets CE to indicate severe congestion, and
       congested network devices additionally send a Congestion Event
       Notification (CEN) to the tunnel ingress PE for prompt in-network
       reaction.  It updates RFC 6040 to specify a domain-local early-
       warning semantics for the ECT(1) codepoint within managed WAN
       infrastructure.</p>
