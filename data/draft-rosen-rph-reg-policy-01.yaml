abstract:
- language: en
  script: Latn
  content: "<p>RFC 4412 defines the &quot;Resource-Priority Namespaces&quot; and &quot;Resource-Priority
    Priority-values&quot; registries.  The management policy of these registries is
    &quot;Standards Action&quot;.  This document normatively updates RFC 4412 to change
    the management policy of these registries to &quot;IETF Review&quot;.</p>"
