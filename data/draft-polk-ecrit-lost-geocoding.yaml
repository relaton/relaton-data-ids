abstract:
- language: en
  script: Latn
  content: "<p>This document creates new service URNs for geocoding and reverse \ngeocoding
    location formats to be used by location-to-service \ntranslation protocol (LoST)
    to convert location values into a format\nof choice.\nThe key words &quot;MUST&quot;,
    &quot;MUST NOT&quot;, &quot;REQUIRED&quot;, &quot;SHALL&quot;, &quot;SHALL NOT&quot;,\n&quot;SHOULD&quot;,
    &quot;SHOULD NOT&quot;, &quot;RECOMMENDED&quot;, &quot;MAY&quot;, and &quot;OPTIONAL&quot;
    in this\ndocument are to be interpreted as described in RFC 2119 [RFC 2119].</p>"
