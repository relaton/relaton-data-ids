abstract:
- language: en
  script: Latn
  content: "<p>This document defines the format of Uniform Resource Locators (URL)
    for the File Transfer Protocol (FTP) using the general URL syntax defined in RFC
    xxxx, &#39;Uniform Resource Locators (URL)&#39;.                               It
    is a one of a suite of documents which replace RFC 1738, &#39;Uniform Resource
    Locators&#39;, and RFC 1808, &#39;Relative Uniform Resource Locators&#39;.</p>"
