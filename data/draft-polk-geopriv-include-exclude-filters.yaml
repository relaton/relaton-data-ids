abstract:
- language: en
  script: Latn
  content: "<p>This document creates and describes the SIP subscription filters \nnecessary
    to acquire the desired location information in the form of\na Presence Information
    Data Format - Location Object (PIDF-LO) from \na remote SIP user agent (UA).\n\n\nThe
    key words &quot;MUST&quot;, &quot;MUST NOT&quot;, &quot;REQUIRED&quot;, &quot;SHALL&quot;,
    &quot;SHALL NOT&quot;,\n&quot;SHOULD&quot;, &quot;SHOULD NOT&quot;, &quot;RECOMMENDED&quot;,
    &quot;MAY&quot;, and &quot;OPTIONAL&quot; in this\ndocument are to be interpreted
    as described in RFC 2119 [RFC 2119].</p>"
