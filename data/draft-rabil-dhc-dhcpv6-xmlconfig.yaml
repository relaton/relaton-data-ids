    <p>This memo describes an Extensible Markup Language (XML) schema for
    specifying configuration information for Dynamic Host Configuration
    Protocol for IPv6 (DHCPv6) Servers.Requirements Language

    The key words &quot;MUST&quot;, &quot;MUST NOT&quot;, &quot;REQUIRED&quot;, &quot;SHALL&quot;, &quot;SHALL NOT&quot;,
    &quot;SHOULD&quot;, &quot;SHOULD NOT&quot;, &quot;RECOMMENDED&quot;, &quot;MAY&quot;, and &quot;OPTIONAL&quot; in this
    document are to be interpreted as described in RFC 2119 [RFC2119].</p>
