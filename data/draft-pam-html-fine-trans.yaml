abstract:
- language: en
  script: Latn
  content: "<p>The word &#39;hypertext&#39; was coined by Theodor Holm Nelson in his
    paper &#39;A File Structure for the Complex, the Changing and the Indeterminate&#39;,
    presented at the ACM 20th national conference in 1965.  One of the key concepts
    in Nelson&#39;s vision of hypertext is &#39;transclusion&#39; or virtual inclusion,
    which permits composite documents to be constructed by reference to the original
    components rather than by copying.               The Hypertext Markup Language
    (HTML) is a markup language used to create hypertext documents that are platform
    independent.  HTML currently permits the transclusion of various content types
    using tags which accept a &#39;SRC&#39; attribute, such as the IMG, EMBED and
    APPLET tags, but does not provide a mechanism for transcluding textual content.
    \ This document proposes markup for text transclusions in HTML and explains its
    usage.</p>"
