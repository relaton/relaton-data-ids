abstract:
- language: en
  script: Latn
  content: |-
    <p>Composite FrodoKEM defines combinations of FrodoKEM with RSA-OAEP,
       ECDH, X25519, and X448.  This document specifies the algorithm
       definitions, key formats, and certificate conventions for using
       Composite FrodoKEM in the X.509 Public Key Infrastructure.</p>
