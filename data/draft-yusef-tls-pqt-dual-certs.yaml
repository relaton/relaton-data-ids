  content: Post-Quantum Traditional (PQ/T) Hybrid Authentication with Dual Certificates
    in TLS 1.3
docidentifier:
- content: draft-yusef-tls-pqt-dual-certs
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document extends the TLS 1.3 authentication mechanism to allow
       the negotiation and use of two signature algorithms to enable dual-
       algorithm hybrid authentication, ensuring that an attacker would need
       to break both algorithms to compromise the session.  The two
       signature algorithms come from two independent certificates that
       together produce a single Certificate and CertificateVerify message.</p>
