abstract:
- language: en
  script: Latn
  content: "<p>This document provides a comprehensive end-to-end solution for VPLS
    \nOperation, Administration and Maintenance (OAM). This solution is \nbased on
    the L2VPN OAM framework [L2VPN-OAM-REQ-FRMK] and specifies \nhow to meet the requirements
    set therein. \n \n \nConventions \n \nThe key words &quot;MUST&quot;, &quot;MUST
    NOT&quot;, &quot;REQUIRED&quot;, &quot;SHALL&quot;, &quot;SHALL NOT&quot;, \n&quot;SHOULD&quot;,
    &quot;SHOULD NOT&quot;, &quot;RECOMMENDED&quot;, &quot;MAY&quot;, and &quot;OPTIONAL&quot;
    in this \ndocument are to be interpreted as described in RFC 2119</p>"
