abstract:
- language: en
  script: Latn
  content: "<p>This document describes an extension to SIP (RFC 2543) to provide a
    \nmechanism for storing state and other information in SIP comparable \nto the
    HTTP state mechanisms defined in RFC 2109.  This extension \nincludes a new SIP
    header (&#39;Cookie:&#39;), an option tag for feature \nnegotiation (&#39;cookie&#39;)
    and IANA registration considerations for \nregistering the &#39;cookie&#39; extension,
    semantics of the value of the \nCookie: header, and behavioral rules for processing
    these headers by \nSIP nodes supporting the &#39;cookie&#39; extension. This document
    also \nbriefly discusses possible uses of cookies, and security \nconsiderations
    for their use.</p>"
