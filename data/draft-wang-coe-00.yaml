abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines the Cognition-Oriented Emergence (COE)
       protocol, a lightweight, minimalist, narrow-waist cognitive
       interaction protocol.  COE provides a unified &quot;cognitive interaction
       layer&quot; for the fragmented ecosystem of world models.  Through four
       core primitives -- Judge (J), Delegate (D), Terminate (T), and
       Verify (V) -- COE enables heterogeneous world models and AI agents
       to reach verifiable consensus on shared world states within a
       traceable, auditable, and evolvable framework.

       Unlike JEP, which focuses on &quot;accountability tracing&quot; (post-hoc
       audit), COE focuses on &quot;cognitive consensus&quot; (ex-ante / in-situ
       collaboration).  COE does not depend on any specific world model
       implementation; instead, it serves as a common &quot;trust operating
       system&quot; and &quot;collaboration grammar&quot; for them.  JEP answers &quot;who is
       responsible,&quot; and COE answers &quot;what the world is&quot; -- both share the
       J/D/T/V primitive gene, forming a complete &quot;cognition‑accountability&quot;
       dual-loop architecture.</p>
