  content: "<p>This memo defines how the 6bone uses the 3FFE::/16 IPv6 address prefix,
    allocated in RFC 2471, &quot;IPv6 Testing Address Allocation&quot;, to create
    pseudo Top-Level Aggregation Identifiers (pTLA&#39;s) and pseudo Next-Level Aggregation
    Identifiers (pNLA&#39;s).  This memo provides information for the Internet community.</p>"
