  script: Latn
  content: "<p>This document registers the Enumservices &quot;email&quot;, &quot;fax&quot;,
    &quot;sms&quot;, &quot;ems&quot;, and &quot;mms&quot; using the URI schemes &#39;tel:&#39;
    and &#39;mailto:&#39; as per the IANA registration process defined in the ENUM
    specification RFC 3761. [STANDARDS-TRACK]</p>"
