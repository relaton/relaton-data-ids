abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes solution-agnostic and technology-neutral
       schema for how various intermediaries can gate content and services
       based on age.  The analysis of the architecture is done based on the
       effectiveness of permitting or restricting access based on age.  The
       document concludes with recommendations as well as critical privacy,
       security and human rights considerations.</p>
