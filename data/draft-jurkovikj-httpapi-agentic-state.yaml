abstract:
- language: en
  script: Latn
  content: |-
    <p>HTTP applications frequently expose one logical object through
       several representations or resources.  Ordinary HTTP entity tags
       identify selected representations; they do not, by themselves,
       provide a conditional-update mechanism spanning different request
       targets.

       This Experimental document specifies Agentic State Transfer (AST), an
       HTTP profile for preventing lost updates to shared application state.
       It designates one State-Bearing Resource for each concurrency domain
       and requires every Core protected mutation to target that resource
       using the strong ETag of its State-Bearing Representation in the
       standard If-Match field.

       The profile also defines all-writer atomicity, strict nonmutating
       failure, deferred-commit protection, reconciliation after conflict,
       state discovery, cache and representation constraints, and security
       requirements.  It uses only existing HTTP conditional request fields.</p>
