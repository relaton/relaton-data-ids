abstract:
- language: en
  script: Latn
  content: "<p>RFC 3966 explicitly states that &#39;tel&#39; URIs may not represent
    a dial string.  That leaves no way specify a dial string in a standardized way.
    \ Great confusion exists with the SIP URI parameter &quot;user=phone&quot;, and
    specifically, if it can represent a dial string.  This memo creates a new value
    for the user parameter &quot;dialstring&quot;, so that one may specify &quot;user=dialstring&quot;
    to encode a dial string as a &#39;sip:&#39; or &#39;sips:&#39; URI. [STANDARDS-TRACK]</p>"
