abstract:
- language: en
  script: Latn
  content: "<p>This document registers a group of &#39;enumservices&#39; [5] to be
    used to \nindicate that the associated resources are capable of receiving \ndiscrete
    messages.\nSpecifically, the &#39;enumservices&#39; registered with this document
    are \n&#39;email&#39;, &#39;fax&#39;, &#39;sms&#39;, &#39;ems&#39; and &#39;mms&#39;
    using the URI schemes \n&#39;mailto:&#39; and &#39;tel:&#39;</p>"
