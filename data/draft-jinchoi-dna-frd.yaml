abstract:
- language: en
  script: Latn
  content: |-
    <p>For efficient DNA, a host should quickly receive an RA upon a new
       link-layer connection.  This draft presents a quick RA acquisition
       scheme with the support of a link-layer entity, PoA (Point of
       Attachment).  Upon a new network attachment, the PoA may either
       trigger an AR (Access Router) to immediately send an unicast RA, &quot;RA
       Triggering&quot; or send such an RA for itself, &quot;RA Proxying&quot;.  We may put
       &quot;RA Triggering&quot; or &quot;RA Proxying&quot; functionality on a PoA to get the
       optimized result without IPv6 standard change.</p>
