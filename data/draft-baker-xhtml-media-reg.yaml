abstract:
- language: en
  script: Latn
  content: "<p>This document defines the &#39;application/xhtml+xml&#39; MIME media
    type for XHTML based markup languages; it is not intended to obsolete any previous
    IETF documents, in particular RFC 2854 which registers &#39;text/html&#39;.  This
    memo provides information for the Internet community.</p>"
