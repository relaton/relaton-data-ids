abstract:
- language: en
  script: Latn
  content: "<p>LSP-Ping is a widely deployed Operation, Administration, and \nMaintenance
    (OAM) mechanism in MPLS networks. However, in the present \nform, this mechanism
    is inadequate to verify connectivity of a \nsegment of a Multi-Segment PseudoWire
    (MS-PW) from any node on the \npath of the MS-PW. Similar shortcoming is seen
    on a bidirectional co-\nrouted MPLS TP LSPs. This document defines a TLV to address
    these \nshortcomings. \n\nRequirements Language \n\nThe key words &quot;MUST&quot;,
    &quot;MUST NOT&quot;, &quot;REQUIRED&quot;, &quot;SHALL&quot;, &quot;SHALL \nNOT&quot;,&quot;SHOULD&quot;,
    &quot;SHOULD NOT&quot;, &quot;RECOMMENDED&quot;, &quot;MAY&quot;, and &quot;OPTIONAL&quot;
    in \nthis document are to be interpreted as described in RFC 2119 [3].</p>"
