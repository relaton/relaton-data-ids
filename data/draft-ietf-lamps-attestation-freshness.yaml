title:
- language: en
  script: Latn
  content: Nonce-based Freshness for Remote Attestation in Certificate Signing Requests
    (CSRs) for the Certification Management Protocol (CMP), for Enrollment over Secure
    Transport (EST), and for Certificate Management over CMS (CMC)
docidentifier:
- content: draft-ietf-lamps-attestation-freshness
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>When an end entity includes attestation statements in a Certificate
       Signing Request (CSR), this document is specifically concerned with
       establishing the freshness of Evidence statements among that
       attestation data.  Current attestation technology commonly achieves
       this using nonces.

       This document outlines the process through which nonces are supplied
       to the end entity by an RA/CA for inclusion in Evidence, leveraging
       the Certificate Management Protocol (CMP), Enrollment over Secure
       Transport (EST), and Certificate Management over CMS (CMC).</p>
