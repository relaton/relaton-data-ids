abstract:
- language: en
  script: Latn
  content: "<p>This document describes the &quot;envelope-dsn&quot;, &quot;redirect-dsn&quot;,
    &quot;envelope-deliverby&quot;, and &quot;redirect-deliverby&quot; extensions
    to the Sieve email filtering language.  The &quot;envelope-dsn&quot; and &quot;envelope-
    deliverby&quot; extensions provide access to additional envelope information provided
    by the delivery status notification (DSN) and Deliver-By SMTP extensions, respectively.
    \ The &quot;redirect-dsn&quot; and &quot;redirect-deliverby&quot; extensions extend
    Sieve&#39;s redirect action to provide control over delivery status notification
    and Deliver-By parameters, respectively. [STANDARDS-TRACK]</p>"
