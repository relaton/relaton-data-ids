abstract:
- language: en
  script: Latn
  content: "<p>This document presents definitions for the &#39;&#39;sysman&#39;&#39;
    (systems\n   management) abstract service, and the &#39;&#39;dmi&#39;&#39; (desktop
    management\n   interface), &#39;&#39;cim&#39;&#39; (common information model),
    &#39;&#39;snmp&#39;&#39; (simple network\n   management protocol), and &#39;&#39;host&#39;&#39;
    concrete service types. These\n   definitions are suitable for use with the Service
    Location Protocol\n   [1].\n \n   Systems management, as used in this document,
    relates to the\n   monitoring, diagnosing, service and support of desktop and\n
    \  host computers.</p>"
