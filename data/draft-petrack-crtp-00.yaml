abstract:
- language: en
  script: Latn
  content: "<p>We analyze the requirement to compress the headers of RTP data streams.
    It is argued that there is a need to define two different compression schemes:
    an &#39;interim solution&#39; in which only RTP headers are compressed, and a
    &#39;complete solution&#39; which compresses the RTP/UDP/IP headers only across
    serial links.  It is argued that the complete solution must include a new &#39;guaranteed
    header compression service,&#39; if it is to be useful.      The two solutions
    are described, along with a transition strategy which ensures that only the complete
    solution will be used when this is possible.</p>"
