  content: |-
    <p>This document describes how to carry 64 kbit/s channel data transparently in RTP packets, using a pseudo-codec called &quot;Clearmode&quot;. It also serves as registration for a related MIME type called &quot;audio/clearmode&quot;.

     &quot;Clearmode&quot; is a basic feature of VoIP Media Gateways. [STANDARDS-TRACK]</p>
