abstract:
- language: en
  script: Latn
  content: "<p>This memo discusses the applicability of &quot;Extensions to RSVP (Resource
    ReSerVation Protocol) for LSP Tunnels&quot;.  It highlights the protocol&#39;s
    principles of operation and describes the network context for which it was designed.
    \ Guidelines for deployment are offered and known protocol limitations are indicated.
    \ This document is intended to accompany the submission of &quot;Extensions to
    RSVP for LSP Tunnels&quot; onto the Internet standards track.  This memo provides
    information for the Internet community.</p>"
