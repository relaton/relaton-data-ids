abstract:
- language: en
  script: Latn
  content: "<p>This document defines the use of Generalized Multi-Protocol Label \nSwitching
    (GMPLS) Calls for parameter negotiation in Automatically \nSwitched Optical Networks
    (ASON) and Wavelength Switched Optical \nNetworks (WSON). The intention of the
    document is to provide a \nreference for the authors of future documents to understand
    the \napplication of GMPLS Calls. \n\n\n\n\n \n \n Conventions used in this document
    \n\nThe key words &quot;MUST&quot;, &quot;MUST NOT&quot;, &quot;REQUIRED&quot;,
    &quot;SHALL&quot;, &quot;SHALL NOT&quot;, \n&quot;SHOULD&quot;, &quot;SHOULD NOT&quot;,
    &quot;RECOMMENDED&quot;, &quot;MAY&quot;, and &quot;OPTIONAL&quot; in this \ndocument
    are to be interpreted as described in RFC-2119 [RFC2119].</p>"
