abstract:
- language: en
  script: Latn
  content: |-
    <p>The H.323 specification [2] defines a means for building multimedia 
    communication services over an arbitrary Packet Based Network, 
    including the Internet. This document registers an ENUM service for 
    H.323 according to specifications and guidelines in RFC2916bis [3].</p>
