abstract:
- language: en
  script: Latn
  content: "<p>This document describes the actors in a global Tier-1 ENUM System \nand
    the roles and responsibilities that each of the actors fulfills.  \nIn this context,
    a &#39;Tier-1 ENUM System&#39; refers to a holistic system \nfor registering E.164
    telephone numbers in a DNS top-level domain. \nThe population of NAPTR records
    with URI&#39;s in a Tier-2 ENUM System \nas described in RFC 2916 [4] is not discussed
    in this draft.</p>"
