abstract:
- language: en
  script: Latn
  content: |-
    <p>This document registers the &#39;ENUMservices&#39; &#39;conf-web&#39; with the
       &#39;http:&#39; and &#39;https:&#39; URI schemes, and &#39;conf-uri&#39; using the URI
       schemes &#39;sip:&#39;, &#39;sips:&#39;, and &#39;h323:&#39; as per the IANA registration
       process defined in the ENUM specification RFC3761.  These
       ENUMservices indicate that the telephone number is associated with a
       conference and provide additional information and ways to participate
       in the conference.</p>
