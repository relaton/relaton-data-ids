abstract:
- language: en
  script: Latn
  content: "<p>This document registers the Enumservice named &quot;vmsg&quot;, which
    is used to facilitate the real-time routing of voice, video, and unified communications
    to a messaging system.  This vmsg Enumservice registers three Enumservice types:
    &quot;voicemsg&quot;, &quot;videomsg&quot;, and &quot;unifmsg&quot;.  Each type
    also registers the subtypes &quot;sip&quot;, &quot;sips&quot;, &quot;http&quot;,
    and &quot;https&quot;, as well as the subtype &quot;tel&quot; for the &quot;voicemsg&quot;
    type. [STANDARDS-TRACK]</p>"
