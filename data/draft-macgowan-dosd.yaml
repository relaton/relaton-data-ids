abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes the Domain Operational Standing Declaration
       (DOSD) protocol, a voluntary DNS-based mechanism by which domain
       owners may publish governance declarations, stewardship status,
       provenance chains, and mediation routing information.  DOSD uses
       DNS TXT records for discovery and a well-known JSON file for
       canonical metadata.  The protocol defines a Notice and Commerce
       Protocol (NCP) state machine for escalating notice tiers, a white
       flag signaling mechanism for requesting peaceful mediation, a
       Deadman Stewardship Extension (DOSD-DMS) for signaling stewardship-
       absent states, and a portable identity token format (DOSD-IT) for
       participant attestation.  DOSD does not determine legal validity or
       sovereignty.  It provides discoverable, tamper-evident, publicly
       verifiable infrastructure for notice, declaration, and mediation
       routing.</p>
