abstract:
- language: en
  script: Latn
  content: "<p>This document describes extensions to the Bidirectional Forwarding
    \nDetection (BFD) protocol to support Performance Measurement for \nIP/MPLS network.
    Specifically, it defines BFD extensions for \nmeasuring packet loss, delay and
    delay variation for arbitrary paths \nbetween systems. \n\nConventions used in
    this document \n\nThe key words &quot;MUST&quot;, &quot;MUST NOT&quot;, &quot;REQUIRED&quot;,
    &quot;SHALL&quot;, &quot;SHALL NOT&quot;, \n&quot;SHOULD&quot;, &quot;SHOULD NOT&quot;,
    &quot;RECOMMENDED&quot;, &quot;MAY&quot;, and &quot;OPTIONAL&quot; in this \ndocument
    are to be interpreted as described in RFC-2119 [RFC2119].</p>"
