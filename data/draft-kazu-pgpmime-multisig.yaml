abstract:
- language: en
  script: Latn
  content: "<p>PGP/MIME provides single signature service of PGP in the context of
    MIME, however, multiple signature service is desired for usability and flexibility.
    For this purpose, this memo defines &#39;Multipart/PGP-Signature&#39; used as
    the &#39;protocol&#39; parameter and the content type of the second part of &#39;Multipart/Signed&#39;.
    \                                                    Canonical MIME format used
    in PGP/MIME is reasonable but it is not enough for some kinds of MIME objects,
    particularly for ISO 2022 text. Thus, this memo extends the &#39;micalg&#39; parameter
    syntax as &#39;pgp-&lt;hash-symbol&gt;+&lt;canform-symbol&gt;&#39; so that &lt;canform-symbol&gt;
    can specify more specific canonicalization for signature calculation.</p>"
