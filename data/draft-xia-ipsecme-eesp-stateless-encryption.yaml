abstract:
- language: en
  script: Latn
  content: |-
    <p>This draft first introduces several use cases for stateless
       encryption, analyzes and compares some existing stateless encryption
       schemes in the industry, and then attempts to propose a general and
       flexible stateless encryption scheme based on the summarized
       requirements.</p>
