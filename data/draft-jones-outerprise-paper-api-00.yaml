- language: en
  script: Latn
  content: |-
    <p>This document specifies two machine-readable markings for a printed
       evidence package, a relationship reference and an assertion about the
       exact digital source.  A relying party can verify an authorized
       signature and source digest offline.  The profile describes the
       limits of verification when the relying party has only paper.</p>
