abstract:
- language: en
  script: Latn
  content: "<p>This document describes a new telnet authentication type &#39;Simple-Strong
    Authentication&#39;.  Telnet authentication is described in RFC1416, &#39;Telnet
    Authentication Option&#39;, and other telnet authentcation types are described
    in RFC 1411, &#39;Telnet Authentication: Kerberos Version 4&#39;.  The data used
    for Simple-Strong Authentication is described in the X.511 standard (ISO9594-3).</p>"
