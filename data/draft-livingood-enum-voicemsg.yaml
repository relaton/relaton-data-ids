abstract:
- language: en
  script: Latn
  content: "<p>This document registers the Enumservice type &quot;voicemsg&quot; with
    the \n   subtype &quot;sip&quot; using the URI scheme sip, the subtype &quot;tel&quot;
    using the \n   URI scheme &#39;tel&#39;, the subtype &quot;http&quot; using the
    URI scheme &#39;http&#39;, and \n   the subtype &quot;https&quot; using the URI
    scheme &#39;https&#39; as per the IANA \n   registration process defined in the
    ENUM specification, RFC 3761.  \n   This Enumservice is used to facilitate the
    real-time routing of voice \n   communications to a voice messaging system.</p>"
