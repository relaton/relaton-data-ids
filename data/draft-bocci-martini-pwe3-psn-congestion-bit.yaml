abstract:
- language: en
  script: Latn
  content: "<p>Draft-ietf-pwe3-congestion-frmwk-00.txt [2] describes requirements
    \nfor a PE providing a PWE3 service to take action if congestion is \ndetected
    in the underlying PSN. This draft provides a control plane \nmechanism to enable
    a downstream PE detecting congestion to signal \nthat congestion state to an upstream
    PE so that it may take \nappropriate action on its PWs. \n\nConventions used in
    this document \n\nThe key words &quot;MUST&quot;, &quot;MUST NOT&quot;, &quot;REQUIRED&quot;,
    &quot;SHALL&quot;, &quot;SHALL NOT&quot;, \n&quot;SHOULD&quot;, &quot;SHOULD NOT&quot;,
    &quot;RECOMMENDED&quot;, &quot;MAY&quot;, and &quot;OPTIONAL&quot; in this \ndocument
    are to be interpreted as described in RFC-2119 [1].</p>"
