title:
- language: en
  script: Latn
  content: Allowing SIP Resource-Priority Header in SIP Responses
docidentifier:
- content: draft-polk-sip-rph-in-responses
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: "<p>The Session Initiation Protocol (SIP) Resource-Priority Header is \nignored
    in SIP responses, according to RFC 4412.  This was a\ndesign choice during RFC
    4412&#39;s development. This is now considered \na bad design choice in certain
    scenarios.  This document corrects \nRFC 4412&#39;s communications model by optionally
    allowing a SIP server \nor user agent (UA) to process the Resource-Priority Header
    in a \nresponse.\nThe key words &quot;MUST&quot;, &quot;MUST NOT&quot;, &quot;REQUIRED&quot;,
    &quot;SHALL&quot;, &quot;SHALL NOT&quot;,\n&quot;SHOULD&quot;, &quot;SHOULD NOT&quot;,
    &quot;RECOMMENDED&quot;, &quot;MAY&quot;, and &quot;OPTIONAL&quot; in this\ndocument
    are to be interpreted as described in [RFC2119].</p>"
