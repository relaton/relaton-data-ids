abstract:
- language: en
  script: Latn
  content: "<p>This document defines the &quot;info&quot; Uniform Resource Identifier
    (URI) scheme for information assets with identifiers in public namespaces.  Namespaces
    participating in the &quot;info&quot; URI scheme are regulated by an &quot;info&quot;
    Registry mechanism.  This memo provides information for the Internet community.</p>"
