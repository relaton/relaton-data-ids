  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: "<p>With the increase in privacy-enabling cryptographic software, there
    exists the growing problem of verification of the &#39;validity&#39; of a cryptographic
    &#39;key&#39;. That is, the recipient of (for example) a PGP-signed email message
    from an unknown person generally has no ready, convenient means to verify that
    the &#39;signature&#39; on the message actually belongs to the sender. To verify
    the relationship between a cryptographic &#39;key&#39; and an identity (real or
    anonymous), it is necessary for an individual to contact one of several existing
    &#39;manual&#39; keyservers as a separate process, request the key (if it exists
    on that keyserver), and retrieve it before being able to use it for any reference
    or validation purposes.          This draft is meant to propose a protocol/system
    that would both enable the automatic retrieval of cryptographic keys, and the
    exchange of keys between servers (both new keys, and those deleted through revocation
    certificates). This proposal could be extended to allow retrieval of cryptographic
    certificates and/or &#39;credentials&#39; with relatively minor difficulty.</p>"
