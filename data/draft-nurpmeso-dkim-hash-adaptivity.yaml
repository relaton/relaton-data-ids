abstract:
- language: en
  script: Latn
  content: |-
    <p>DKIM (RFC 6376, section 3.7) defines how &quot;data-hash&quot; is generated as
       input to a &quot;sig-alg&quot; for the purpose of generating a cryptographic
       signature.  Different to the RSA algorithm (RFC 8017) solely defined
       for and by DKIM at the time of its creation, modern signature
       algorithms, for example EdDSA (RFC 8032), include extensive data
       hashing as part of the signing process.  For these algorithms it may
       make sense not to create a &quot;data-hash&quot;, but to use the entire data as
       input to &quot;sig-alg&quot;.  This specification allows DKIM signing
       algorithms &quot;data-hash&quot; adaptivity, taking advantage of algorithm
       design, and digital signature API reality.</p>
