abstract:
- language: en
  script: Latn
  content: "<p>This document describes a data structure (XODL: Object Description
    Language) and an associated method which, together, provide a means of representing
    situations or types of situations.  It can thus be used to represent objects,
    events, or systems of objects and events or types of objects, events or systems.
    \ Objects represented can be computer data objects (&#39;stack&#39;, &#39;word
    processor&#39;, &#39;user interface&#39;, etc.) or &#39;real&#39; objects such
    as computers, networks, users, and so on.</p>"
