abstract:
- language: en
  script: Latn
  content: "<p>This draft describes a generic associated channel header (GE-ACH) \nthat
    provides a control channel associated with an MPLS LSP, \npseudowire or MPLS section.
    The VCCV ACH defined for PWs in RFC 5085 \nis generalized to allow a larger set
    of control channel and OAM \nfunctions to be used to meet the requirements of
    packet transport and \nother applications of MPLS.\n\n\nConventions used in this
    document \n\nThe key words &quot;MUST&quot;, &quot;MUST NOT&quot;, &quot;REQUIRED&quot;,
    &quot;SHALL&quot;, &quot;SHALL NOT&quot;, \n&quot;SHOULD&quot;, &quot;SHOULD NOT&quot;,
    &quot;RECOMMENDED&quot;, &quot;MAY&quot;, and &quot;OPTIONAL&quot; in this \ndocument
    are to be interpreted as described in RFC-2119 [1].</p>"
