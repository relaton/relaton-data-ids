abstract:
- language: en
  script: Latn
  content: |-
    <p>This document distinguishes between the terms &quot;function&quot; and &quot;path&quot;.
       It also recommends against use of the terms &quot;fast path&quot;, &quot;slow path&quot;,
       and &quot;host path&quot; in IETF documents.  However, it defines the terms
       &quot;congestion vulnerable path&quot; and &quot;congestion critical path&quot;.</p>
