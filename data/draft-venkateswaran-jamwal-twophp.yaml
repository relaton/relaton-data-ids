abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies the 2-Phase HTTP Protocol (2PHP), a backward-
       compatible, opt-in extension to HTTP mutation semantics that
       introduces a two-phase handshake at service request boundaries. 2PHP
       ensures that a mutation request is durably registered on both the
       client and the server before any processing commences, addressing a
       structural gap in existing HTTP REST semantics where no standard
       mechanism exists to confirm bilateral intent registration prior to
       execution.

       2PHP operates at the HTTP protocol layer, requires no new transport
       mechanisms, and is composable across independently operating service
       boundaries.  This document further defines a standardized Intent
       Ledger model for durable, queryable, cross-service correlation of
       request intent, distinct from execution telemetry provided by
       distributed tracing systems.

       This document defines the protocol headers, phase state machine,
       idempotency and replay behavior, the three-tier Intent Ledger
       architecture, cross-service correlation model, and IANA registration
       of the associated HTTP header fields.</p>
