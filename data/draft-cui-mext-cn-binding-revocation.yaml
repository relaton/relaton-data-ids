abstract:
- language: en
  script: Latn
  content: "<p>This document specifies an extension to Binding Revocation mechanism;
    \nthe correspondent node may also initiate the binding revocation in \nRoute Optimization
    mode. This extension provides a method to change \nthe Route Optimization mode
    to the Bidirectional Tunneling mode. \n\n \n\n \n\nConventions used in this document
    \n\nThe key words &quot;MUST&quot;, &quot;MUST NOT&quot;, &quot;REQUIRED&quot;,
    &quot;SHALL&quot;, &quot;SHALL NOT&quot;, \n&quot;SHOULD&quot;, &quot;SHOULD NOT&quot;,
    &quot;RECOMMENDED&quot;, &quot;MAY&quot;, and &quot;OPTIONAL&quot; in this \ndocument
    are to be interpreted as described in [RFC2119].</p>"
